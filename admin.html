<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin SUBHAN AUTO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#111827}.wrap{max-width:900px;margin:auto;padding:24px}.box{background:#fff;padding:22px;border-radius:14px;margin:15px 0;box-shadow:0 4px 20px #0001}input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{background:#111827;color:#fff;font-weight:700;cursor:pointer}.danger{background:#b42318}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0;display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center}.item img{width:110px;height:75px;object-fit:cover;border-radius:8px}.muted{color:#667085;font-size:13px}@media(max-width:650px){.row{grid-template-columns:1fr}.item{grid-template-columns:80px 1fr}.item img{width:80px;height:65px}.item>div:last-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}}</style></head>
<body><div class="wrap"><h1>SUBHAN AUTO — Admin</h1><div id="login" class="box"><h2>Login Admin</h2><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button onclick="login()">Masuk</button><p id="msg"></p></div>
<div id="app" style="display:none"><div class="box"><button onclick="logout()">Keluar</button></div><div class="box"><h2 id="formTitle">Tambah Unit</h2><input id="id" type="hidden"><div class="row"><input id="brand" placeholder="Merek"><input id="model" placeholder="Model"></div><div class="row"><input id="year" type="number" placeholder="Tahun"><input id="price" type="number" placeholder="Harga (contoh 225000000)"></div><div class="row"><input id="km" type="number" placeholder="Kilometer"><select id="transmission"><option>Automatic</option><option>Manual</option></select></div><div class="row"><select id="fuel"><option>Bensin</option><option>Diesel</option><option>Hybrid</option><option>Electric</option></select><select id="status"><option value="available">Tersedia</option><option value="sold">Terjual</option></select></div><textarea id="description" placeholder="Deskripsi"></textarea><input id="photo" type="file" accept="image/*"><button onclick="saveCar()">Simpan Unit</button><button onclick="resetForm()">Batal / Unit Baru</button><p id="saveMsg"></p></div><div class="box"><h2>Daftar Unit</h2><div id="list">Memuat...</div></div></div></div>
<script>
const SUPABASE_URL="https://ooqxjmcfigktcffpumew.supabase.co",SUPABASE_KEY="sb_publishable_MjwyxMw44OSDFYrWLTWiqQ_51q48vvV";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});msg.textContent=error?error.message:"";if(!error)await start()}
async function start(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:a,error}=await sb.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();if(error||!a){msg.textContent=error?error.message:"Akun belum terdaftar sebagai admin.";await sb.auth.signOut();return}login.style.display="none";app.style.display="block";load()}
async function logout(){await sb.auth.signOut();location.reload()}
function resetForm(){document.querySelectorAll("#app input,#app textarea").forEach(x=>{if(x.type!=="file"&&x.id!=="id")x.value=""});id.value="";formTitle.textContent="Tambah Unit";photo.value="";saveMsg.textContent=""}
async function saveCar(){saveMsg.textContent="Menyimpan...";let car={brand:brand.value.trim(),model:model.value.trim(),year:+year.value,price:+price.value,km:+km.value||0,transmission:transmission.value,fuel:fuel.value,status:status.value,description:description.value.trim()};if(!car.brand||!car.model||!car.year||!car.price){saveMsg.textContent="Merek, model, tahun, dan harga wajib diisi.";return}let file=photo.files[0];if(file){if(file.size>8*1024*1024){saveMsg.textContent="Foto maksimal 8 MB.";return}let ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");let path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;let up=await sb.storage.from("car-photos").upload(path,file,{upsert:false,contentType:file.type||"image/jpeg"});if(up.error){saveMsg.textContent=up.error.message;return}car.photo_url=SUPABASE_URL+"/storage/v1/object/public/car-photos/"+path}
let res=id.value?await sb.from("cars").update(car).eq("id",id.value):await sb.from("cars").insert(car);saveMsg.textContent=res.error?res.error.message:"Tersimpan.";if(!res.error){resetForm();load()}}
async function load(){const {data,error}=await sb.from("cars").select("*").order("created_at",{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=data.length?data.map(c=>'<div class="item">'+(c.photo_url?'<img src="'+esc(c.photo_url)+'" alt="Foto unit">':'<div class="muted">Tanpa foto</div>')+'<div><b>'+esc(c.brand+" "+c.model)+'</b><br>'+c.year+' · Rp '+Number(c.price).toLocaleString("id-ID")+'<br>'+esc(c.status==='sold'?"TERJUAL":"TERSEDIA")+'</div><div><button onclick="editCar('+c.id+')">Edit</button><button class="danger" onclick="delCar('+c.id+')">Hapus</button></div></div>').join(""):"Belum ada unit."}
async function editCar(i){const {data,error}=await sb.from("cars").select("*").eq("id",i).single();if(error||!data){alert(error?.message||"Unit tidak ditemukan");return}Object.keys(data).forEach(k=>{if(document.getElementById(k)&&k!=="photo_url"&&k!=="created_at")document.getElementById(k).value=data[k]??""});id.value=data.id;formTitle.textContent="Edit Unit"}
async function delCar(i){if(!confirm("Hapus unit ini?"))return;const {error}=await sb.from("cars").delete().eq("id",i);if(error){alert(error.message);return}load()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
sb.auth.getSession().then(({data:{session}})=>session?start():null);
</script></body></html>
